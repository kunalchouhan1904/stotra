<div class="sidebar-root">

  <!-- Mobile menu button -->

  <button
    type="button"
    class="mobile-menu-button"
    (click)="toggleSidebar()"
    [attr.aria-expanded]="mobileOpen"
    [attr.aria-label]="mobileOpen ? 'Close navigation' : 'Open navigation'"
  >
    <span>
      {{ mobileOpen ? '✕' : '☰' }}
    </span>
  </button>


  <!-- Sidebar -->

  <aside
    class="sidebar-shell"
    [class.collapsed]="collapsed"
    [class.mobile-open]="mobileOpen"
  >

    <!-- Collapse -->

    <button
      type="button"
      class="desktop-toggle"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="!collapsed"
      [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
      title="Collapse / Expand sidebar"
    >
      <span>
        {{ collapsed ? '›' : '‹' }}
      </span>
    </button>


    <nav
      class="sidebar"
      aria-label="Main navigation"
    >

      <!-- MAIN -->

      <div class="nav-section-label">
        Menu
      </div>


      <a
        routerLink="/home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="onNavigationClick()"
        title="Home"
      >

        <span class="nav-icon">
          ⌂
        </span>

        <span class="nav-label">
          Home
        </span>

      </a>


      <a
        routerLink="/library"
        routerLinkActive="active"
        (click)="onNavigationClick()"
        title="Library"
      >

        <span class="nav-icon">
          📖
        </span>

        <span class="nav-label">
          Library
        </span>

      </a>


      <a
        routerLink="/favorites"
        routerLinkActive="active"
        (click)="onNavigationClick()"
        title="Favorites"
      >

        <span class="nav-icon">
          ♡
        </span>

        <span class="nav-label">
          Favorites
        </span>

      </a>


      <!-- DIVIDER -->

      <div class="sidebar-divider"></div>


      <!-- COLLECTION -->

      <div class="nav-section-label">
        Collection
      </div>


      <a
        routerLink="/library"
        [queryParams]="{ category: 'Chalisa' }"
        (click)="onNavigationClick()"
        title="Chalisa"
      >

        <span class="nav-icon">
          ॐ
        </span>

        <span class="nav-label">
          Chalisa
        </span>

      </a>


      <a
        routerLink="/library"
        [queryParams]="{ category: 'Mantra' }"
        (click)="onNavigationClick()"
        title="Mantra"
      >

        <span class="nav-icon">
          📿
        </span>

        <span class="nav-label">
          Mantra
        </span>

      </a>


      <a
        routerLink="/library"
        [queryParams]="{ category: 'Aarti' }"
        (click)="onNavigationClick()"
        title="Aarti"
      >

        <span class="nav-icon">
          🪔
        </span>

        <span class="nav-label">
          Aarti
        </span>

      </a>


      <a
        routerLink="/library"
        [queryParams]="{ category: 'Stotra' }"
        (click)="onNavigationClick()"
        title="Stotra"
      >

        <span class="nav-icon">
          📜
        </span>

        <span class="nav-label">
          Stotra
        </span>

      </a>


      <!-- DIVIDER -->

      <div class="sidebar-divider"></div>


      <!-- OCCASIONS -->

      <div class="nav-section-label">
        Occasions
      </div>


      <a
        routerLink="/library"
        [queryParams]="{ type: 'festival' }"
        (click)="onNavigationClick()"
        title="Festivals"
      >

        <span class="nav-icon">
          🪔
        </span>

        <span class="nav-label">
          Festivals
        </span>

      </a>


      <!-- BOTTOM MESSAGE -->

      <div class="sidebar-message">

        <span class="message-symbol">
          ॐ
        </span>

        <strong class="nav-label">
          Sacred words
        </strong>

        <small class="nav-label">
          Timeless prayers, always with you.
        </small>

      </div>

    </nav>

  </aside>


  <!-- Mobile backdrop -->

  <div
    class="sidebar-backdrop"
    [class.visible]="mobileOpen"
    (click)="closeMobileSidebar()"
    aria-hidden="true"
  ></div>

</div>
