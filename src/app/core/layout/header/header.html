<header class="header">

  <!-- =====================================================
       BRAND
  ====================================================== -->

  <a
    routerLink="/home"
    class="brand"
    aria-label="Stotra Home"
  >

    <span class="brand-mark">
      ॐ
    </span>

    <span class="brand-copy">

      <span class="brand-title">
        Stotra
      </span>

      <span class="brand-tagline">
        Prayer • Recite • Listen
      </span>

      <span class="creator-credit">
        by Kunal Chouhan
      </span>

    </span>

  </a>


  <!-- =====================================================
       AUDIO READER
       Reads the prayer currently loaded in .reader-scroll
  ====================================================== -->

  <div
    class="audio-player"
    [class.is-playing]="isPlaying"
    [class.is-paused]="isPaused"
    role="region"
    aria-label="Prayer audio reader"
  >

    <span class="audio-icon" aria-hidden="true">
      🔊
    </span>

    <span class="audio-label">
      Listen
    </span>


    <!-- PLAY / PAUSE -->

    <button
      type="button"
      class="audio-button play-button"
      [attr.aria-label]="
        isPlaying
          ? (isPaused ? 'Resume reading' : 'Pause reading')
          : 'Read current prayer'
      "
      [attr.title]="
        isPlaying
          ? (isPaused ? 'Resume reading' : 'Pause reading')
          : 'Read current prayer'
      "
      (click)="isPlaying ? togglePause() : playAudio()"
    >
      @if (isPlaying && !isPaused) {
        ❚❚
      } @else {
        ▶
      }
    </button>


    <!-- STOP -->

    <button
      type="button"
      class="audio-button stop-button"
      [disabled]="!isPlaying"
      aria-label="Stop reading"
      title="Stop reading"
      (click)="stopAudio()"
    >
      ■
    </button>


    <!-- SPEED -->

    <select
      class="audio-speed"
      [value]="playbackRate"
      (change)="setPlaybackRate($event)"
      aria-label="Reading speed"
      title="Reading speed"
    >
      <option value="0.75">0.75×</option>
      <option value="0.9">0.9×</option>
      <option value="1">1×</option>
      <option value="1.15">1.15×</option>
      <option value="1.3">1.3×</option>
    </select>


    <!-- STATUS -->

    <span class="audio-status" aria-live="polite">
      @if (isPlaying && !isPaused) {
        Reading…
      } @else if (isPaused) {
        Paused
      } @else {
        Listen
      }
    </span>

  </div>


  <!-- =====================================================
       THEME
  ====================================================== -->

  <div class="header-actions">

    <button
      type="button"
      class="theme-button"
      [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.title]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
      (click)="toggleTheme()"
    >
      {{ isDarkMode ? '☀' : '☾' }}
    </button>

  </div>

</header>
