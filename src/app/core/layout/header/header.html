<header class="header">

  <a
    routerLink="/home"
    class="brand"
    aria-label="Stotra Home"
  >

    <span class="brand-mark">
      ॐ
    </span>

    <span class="brand-copy">

      <span class="brand-title">
        Stotra
      </span>

      <span class="brand-tagline">
        Prayer • Recite • Listen
      </span>

      <span class="creator-credit">by Kunal Chouhan</span>

    </span>

  </a>


  <div class="search">

    <span class="search-icon">
      ⌕
    </span>

    <input
      type="text"
      placeholder="Search prayers, deities or festivals..."
      aria-label="Search prayers, deities or festivals"
    >

    <span class="search-shortcut">
      /
    </span>

  </div>


  <div class="header-actions">

    <button
      type="button"
      class="theme-button"
      [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.title]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
      (click)="toggleTheme()"
    >
      {{ isDarkMode ? '☀' : '☾' }}
    </button>

  </div>

</header>
