<div class="reader">

  <article class="reader-page">

    <!-- Reader Header -->
    <header class="reader-header">

      <div class="reader-heading">

        <div class="reader-category">
          चालीसा
        </div>

        <h1>
          श्री हनुमान चालीसा
        </h1>

        <div class="reader-subtitle">
          Hanuman Chalisa
        </div>

      </div>

      <div class="reader-actions">

        <button
          type="button"
          class="reader-action"
          aria-label="Listen to Hanuman Chalisa"
        >
          <span class="action-icon">▶</span>
          <span>Listen</span>
        </button>

        <button
          type="button"
          class="reader-action favorite"
          aria-label="Add to favorites"
        >
          ♡
        </button>

      </div>

    </header>


    <!-- Divider -->
    <div class="reader-divider"></div>


    <!-- Prayer Reading Area -->
    <main class="reader-content">

      <div class="prayer">

        <div class="prayer-invocation">
          ॥ श्री हनुमान चालीसा ॥
        </div>


        <div class="prayer-text">

          <p>
            श्रीगुरु चरन सरोज रज,<br>
            निज मनु मुकुरु सुधारि।
          </p>

          <p>
            बरनऊँ रघुबर बिमल जसु,<br>
            जो दायकु फल चारि॥
          </p>

          <p>
            बुद्धिहीन तनु जानिके,<br>
            सुमिरौं पवन-कुमार।
          </p>

          <p>
            बल बुधि विद्या देहु मोहिं,<br>
            हरहु कलेस बिकार॥
          </p>

          <!--
            Continue the remaining Hanuman Chalisa
            verses here.
          -->

        </div>

      </div>

    </main>

  </article>

</div>
